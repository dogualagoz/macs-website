# http context only: /etc/nginx/conf.d/api.macsclub-http.conf
limit_req_zone $binary_remote_addr zone=macs_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=macs_login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=macs_conn_limit:10m;

upstream macs_backend_ts {
    server 127.0.0.1:8010;
    keepalive 32;
}
