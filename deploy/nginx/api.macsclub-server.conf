# server context only: Plesk Additional nginx directives.
# Requires nginx >= 1.25.1 with http_v2_module; see README for older Plesk.
http2 on;
server_tokens off;
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
client_max_body_size 6m;
large_client_header_buffers 4 8k;

# CONNECT can be rejected by nginx's parser before this rewrite runs (see README).
if ($request_method ~* "^(TRACE|CONNECT)$") { return 405; }

# ^~ prevents Plesk regex locations from bypassing the API proxy.
# Prefix also covers /auth/login/; nginx limits precede application authentication.
location ^~ /auth/login {
    limit_req zone=macs_login_limit burst=10 nodelay;
    limit_req_status 429;
    limit_conn macs_conn_limit 100;
    limit_conn_status 429;
    gzip off;
    # Uncomment only when ngx_brotli is loaded (including Plesk compression settings).
    # brotli off;
    proxy_pass http://macs_backend_ts;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replaces all client-supplied X-Real-IP values; never append them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_connect_timeout 5s;
}

# The app owns path validation and the upload volume; no host alias is required.
location ^~ /uploads/ {
    # High separate ceiling: image-heavy pages from one campus NAT IP pass, a flood still gets 429.
    limit_req zone=macs_upload_limit burst=400 nodelay;
    limit_req_status 429;
    limit_conn macs_conn_limit 100;
    limit_conn_status 429;
    # Replace the app's max-age=0 / immutable header to avoid contradictory caching.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires 1y;
    add_header Cache-Control "public, immutable";
    gzip off;
    # Uncomment only when ngx_brotli is loaded (including Plesk compression settings).
    # brotli off;
    proxy_pass http://macs_backend_ts;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replaces all client-supplied X-Real-IP values; never append them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_connect_timeout 5s;
}

location / {
    limit_req zone=macs_api_limit burst=100 nodelay;
    limit_conn macs_conn_limit 100;
    limit_req_status 429;
    limit_conn_status 429;
    gzip off;
    # Uncomment only when ngx_brotli is loaded (including Plesk compression settings).
    # brotli off;
    proxy_pass http://macs_backend_ts;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replaces all client-supplied X-Real-IP values; never append them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_connect_timeout 5s;
}
