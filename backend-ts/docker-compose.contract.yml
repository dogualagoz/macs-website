services:
  db-new:
    image: postgres:13
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macs_test
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./contract/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./test/helpers/init-head.sql:/docker-entrypoint-initdb.d/02-head.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d macs_test"]
      interval: 2s
      timeout: 2s
      retries: 30
