server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plesk/reverse proxy zaten sikistiriyorsa zarari yok, tek basina calisirken gerekli.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Backend kendi yanitlarina bu basliklari main.py'de ekliyor; statik dosyalar
    # bu container'dan ciktigi icin burada tekrar tanimlaniyor.
    include /etc/nginx/snippets/security-headers.conf;

    # Container healthcheck / uptime probu.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html ASLA cache'lenmemeli: icindeki hash'li bundle adlari her
    # deploy'da degisiyor. Cache'lenirse kullanici eski JS'i istemeye devam eder.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # CRA ciktilari icerik hash'i tasir (main.ca836fb9.js) -> sonsuz cache guvenli.
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # public/assets hash'siz (heropicture.png vb.) -> kisa omurlu cache.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # react-router client-side routing. Bu satir olmadan /admin/members
    # adresinde sayfa yenilendiginde nginx dosyayi bulamayip 404 doner.
    # Son parametre bir URI oldugu icin nginx ic yonlendirme yapar ve istek
    # yukaridaki "location = /index.html" blogunda yeniden eslesir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
