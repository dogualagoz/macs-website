# nginx'te add_header KALITIMSAL DEGILDIR: bir location kendi add_header'ini
# tanimlarsa ust bloktakilerin HEPSI iptal olur. Bu yuzden basliklar tek dosyada
# toplanip add_header iceren her location'a ayri ayri include ediliyor.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
