<!doctype html>
<html lang="tr">
  <head>
    <!-- Temel Meta Etiketleri -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- API sunucusuna baglantiyi (DNS + TLS) JS inmeden baslat. Iki tane:
         axios istekleri CORS (anonim) havuzunu, <img> istekleri ise
         kimlikli havuzu kullaniyor; tarayici bunlari ayri baglanti sayar. -->
    <link rel="preconnect" href="%REACT_APP_API_URL%" crossorigin />
    <link rel="preconnect" href="%REACT_APP_API_URL%" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Etiketleri -->
    <title>MACS - Matematik ve Bilgisayar Bilimleri Topluluğu | ESOGÜ</title>
    <!-- data-rh: react-helmet-async istemcide bu etiketleri sayfaya özel olanlarla
         değiştiriyor (kopya kalmıyor). JS çalıştırmayan paylaşım botları
         (WhatsApp, X, LinkedIn, Facebook) ise bu varsayılanları görüyor. -->
    <meta
      data-rh="true"
      name="description"
      content="MACS, Eskişehir Osmangazi Üniversitesi Matematik ve Bilgisayar Bilimleri Bölümü öğrencilerinin kurduğu, yazılım projeleri ve etkinlikler düzenleyen aktif bir öğrenci topluluğudur."
    />
    <meta
      data-rh="true"
      name="keywords"
      content="MACS, Matematik, Bilgisayar Bilimleri, ESOGÜ, Eskişehir Osmangazi Üniversitesi, yazılım, topluluk, öğrenci kulübü, etkinlik, proje"
    />
    <meta
      name="author"
      content="MACS - Matematik ve Bilgisayar Bilimleri Topluluğu"
    />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Tema ve Favicon -->
    <meta name="theme-color" content="#07132b" />
    <!-- 64px favicon (4 KB); 170px logo (33 KB) her sayfada iniyordu -->
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/assets/images/favicon-64.png" />
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/assets/images/img_exclude.png"
    />

    <!-- Sitenin paylasim kimligi; sayfaya ozel OG/Twitter etiketleri SEO bileseninden gelir -->
    <meta
      data-rh="true"
      property="og:site_name"
      content="MACS - Matematik ve Bilgisayar Bilimleri Topluluğu"
    />
    <meta data-rh="true" name="twitter:site" content="@esogumacs" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:locale" content="tr_TR" />
    <meta data-rh="true" property="og:url" content="https://macsclub.com.tr" />
    <meta
      data-rh="true"
      property="og:title"
      content="MACS - Matematik ve Bilgisayar Bilimleri Topluluğu | ESOGÜ"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Eskişehir Osmangazi Üniversitesi Matematik ve Bilgisayar Bilimleri öğrencilerinin yazılım projeleri ve etkinlikler düzenleyen topluluğu."
    />
    <meta data-rh="true" property="og:image" content="https://macsclub.com.tr/assets/images/og-image.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta
      data-rh="true"
      name="twitter:title"
      content="MACS - Matematik ve Bilgisayar Bilimleri Topluluğu | ESOGÜ"
    />
    <meta data-rh="true" name="twitter:image" content="https://macsclub.com.tr/assets/images/og-image.jpg" />
<!-- Canonical URL: sayfa basina SEO bileseni (react-helmet-async) basiyor.
         Burada sabit bir tane durursa her sayfada iki canonical oluyor ve
         statik olan -ana sayfaya isaret eden- once geliyordu. -->

    <!-- Manifest (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect for Performance -->

    <!-- JSON-LD Yapılandırılmış Veri (Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MACS - Matematik ve Bilgisayar Bilimleri Topluluğu",
        "alternateName": "MACS",
        "url": "https://macsclub.com.tr",
        "logo": "https://macsclub.com.tr/assets/images/img_exclude.png",
        "description": "Eskişehir Osmangazi Üniversitesi Matematik ve Bilgisayar Bilimleri Bölümü öğrenci topluluğu",
        "foundingDate": "2020",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Eskişehir",
          "addressCountry": "TR"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "alagozdogu@gmail.com",
          "telephone": "+90-538-329-6386",
          "contactType": "customer service"
        },
        "sameAs": [
          "https://www.instagram.com/esogumacs/",
          "https://www.linkedin.com/company/esogumacs/"
        ]
      }
    </script>

    <!-- JSON-LD Yapılandırılmış Veri (WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MACS",
        "url": "https://macsclub.com.tr"
      }
    </script>
  </head>
  <body>
    <noscript
      >Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmeniz
      gerekmektedir.</noscript
    >
    <div id="root"></div>
  </body>
</html>
